<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KelasaPass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Kannada:wdth,wght@75..125,300..800&family=Anek+Devanagari:wdth,wght@75..125,300..800&display=swap">
<style>
  :root {
    --page:#eceeec; --frame:#1b1d20; --ground:#e9f0ea; --card:#ffffff; --ink:#0f3a2e; --mute:#557066; --gold:#f0a03a;
    --stop:#b42318; --tint1:#fde7c8; --tint2:#dbeafe; --tint3:#fbe1e1; --tint4:#e3f4e1; --line:#dfe7e1;
    --L0:#557066; --L1:#1f4fa8; --L2:#c27410; --L3:#0f3a2e;
    --font:"Anek Kannada", "Anek Devanagari", "Noto Sans Kannada", "Noto Sans Devanagari", system-ui, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:var(--font); font-variation-settings:"wdth" 100; color:var(--ink); background:var(--page); overflow:hidden; }
  .stage { height:100vh; display:flex; align-items:center; justify-content:center; gap:64px; padding:20px; }
  .caption { text-align:center; margin-bottom:14px; font-weight:700; color:var(--ink); font-size:16px; }
  .caption span { display:inline-block; background:var(--card); border-radius:999px; padding:7px 16px; }
  .caption b { color:var(--gold); }
  .phone { width:372px; height:780px; border-radius:50px; background:var(--frame); padding:10px; position:relative; box-shadow:0 30px 60px rgba(15,58,46,.18); }
  .phone::before { content:""; position:absolute; top:20px; left:50%; transform:translateX(-50%); width:110px; height:28px; background:var(--frame); border-radius:20px; z-index:30; }
  .screen { width:100%; height:100%; border-radius:41px; overflow:hidden; background:var(--ground); position:relative; display:flex; flex-direction:column; }
  .status { height:48px; flex:none; display:flex; justify-content:space-between; align-items:flex-end; padding:0 28px 6px; font-size:15px; font-weight:700; font-family:system-ui, sans-serif; }
  .status .ic { display:flex; gap:5px; align-items:center; }
  .status .bat { width:24px; height:12px; border:2px solid currentColor; border-radius:4px; position:relative; }
  .status .bat::after { content:""; position:absolute; inset:1px 4px 1px 1px; background:currentColor; border-radius:1px; }
  .appbar { flex:none; padding:10px 16px 8px; display:flex; align-items:center; gap:9px; }
  .logo { width:30px; height:30px; border-radius:50%; background:var(--ink); display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; }
  .appbar h1 { font-size:21px; font-weight:800; margin:0; line-height:1; } .appbar small { color:var(--mute); font-size:13px; font-weight:600; }
  .appbar .right { margin-left:auto; }
  .lang { display:flex; background:var(--card); border-radius:999px; padding:3px; }
  .lang button { border:0; background:transparent; font:600 13px var(--font); padding:4px 8px; border-radius:999px; color:var(--mute); cursor:pointer; }
  .lang button.on { background:var(--ink); color:#fff; }
  .body { flex:1; overflow-y:auto; padding:6px 16px 16px; scrollbar-width:none; }
  .body::-webkit-scrollbar { display:none; }
  .nav { flex:none; display:flex; background:var(--card); padding:8px 6px 20px; }
  .nav button { flex:1; border:0; background:none; font:600 13px var(--font); color:var(--mute); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  .nav button svg { width:22px; height:22px; padding:2px 0; } .nav button.on { color:var(--ink); }
  .nav button.on svg { background:var(--tint4); border-radius:999px; width:52px; }
  .card { background:var(--card); border-radius:22px; padding:14px; margin-bottom:10px; }
  .hero { background:var(--ink); color:#fff; border-radius:22px; padding:16px; margin-bottom:12px; }
  .hero.gold { background:var(--gold); color:var(--ink); }
  .hero h2 { margin:0 0 2px; font-size:26px; line-height:1.05; font-weight:800; } .hero p { margin:0; opacity:.88; font-size:15px; line-height:1.3; }
  .mic { width:124px; height:124px; border-radius:50%; border:0; margin:14px auto 8px; display:grid; place-items:center; cursor:pointer; background:var(--gold); position:relative; }
  .mic svg { width:50px; height:50px; color:var(--ink); }
  .mic.rec::before, .mic.rec::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:3px solid rgba(240,160,58,.55); animation:ring 1.2s infinite; }
  .mic.rec::after { animation-delay:.6s; }
  @keyframes ring { from { transform:scale(.9); opacity:1; } to { transform:scale(1.35); opacity:0; } }
  .center { text-align:center; } .hint { color:var(--mute); font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:0; background:var(--card); border-radius:999px; padding:7px 12px; font:600 14px var(--font); color:var(--ink); cursor:pointer; }
  .chip.sel { box-shadow:0 0 0 2px var(--ink) inset; }
  .wave { display:flex; gap:3px; align-items:center; height:28px; }
  .wave i { width:3px; border-radius:3px; background:var(--ink); animation:wv .9s infinite ease-in-out; }
  @keyframes wv { 0%,100% { height:6px; } 50% { height:24px; } }
  .bubble { background:var(--card); border-radius:20px 20px 20px 6px; padding:12px 14px; font-size:16px; line-height:1.4; margin-bottom:10px; }
  .bubble.me { background:var(--tint4); border-radius:20px 20px 6px 20px; margin-left:30px; }
  .bubble .tag { font-size:13px; color:var(--mute); font-weight:700; display:block; margin-bottom:3px; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 2px; }
  .field { border-radius:16px; padding:9px 11px; } .field:nth-child(1) { background:var(--tint1); } .field:nth-child(2) { background:var(--tint2); }
  .field:nth-child(3) { background:var(--tint4); } .field:nth-child(4) { background:var(--tint3); }
  .field small { color:var(--mute); font-size:12px; font-weight:700; display:block; } .field b { font-size:18px; }
  .btn { width:100%; border:0; border-radius:999px; padding:14px; font:700 17px var(--font); cursor:pointer; background:var(--ink); color:#fff; }
  .btn.orange { background:var(--gold); color:var(--ink); }
  .btn.ghost { background:var(--card); color:var(--ink); }
  .btn.mint { background:var(--tint4); color:var(--ink); }
  .row { display:flex; gap:8px; align-items:center; } .row > * { flex:1; }
  .ring { width:64px; height:64px; flex:none; }
  .stat { display:flex; gap:14px; align-items:center; }
  .lvl { display:inline-flex; align-items:center; gap:4px; font:700 12px var(--font); color:#fff; padding:3px 9px; border-radius:999px; }
  .L0 { background:var(--L0); } .L1 { background:var(--L1); } .L2 { background:var(--L2); } .L3 { background:var(--L3); }
  .job h3 { margin:0 0 2px; font-size:19px; } .job .meta { color:var(--mute); font-size:14px; margin-bottom:8px; }
  .pill { display:inline-block; background:var(--ground); border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; margin:0 4px 4px 0; }
  .pill.good { background:var(--tint4); color:var(--ink); }
  .worker { display:flex; gap:12px; align-items:flex-start; }
  .av { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:19px; flex:none; }
  .score { height:8px; border-radius:99px; background:var(--ground); margin:8px 0; overflow:hidden; } .score i { display:block; height:100%; background:var(--gold); }
  .rank { font-size:13px; font-weight:800; color:var(--mute); }
  .toast { position:absolute; left:10px; right:10px; top:52px; z-index:40; background:var(--card); border-radius:20px; padding:12px 14px; box-shadow:0 14px 34px rgba(15,58,46,.22); display:flex; gap:10px; align-items:center; transform:translateY(-150%); opacity:0; visibility:hidden; transition:transform .45s cubic-bezier(.2,1.3,.4,1), opacity .3s, visibility .3s; font-size:15px; line-height:1.3; }
  .toast.show { transform:translateY(0); opacity:1; visibility:visible; } .toast .logo { width:32px; height:32px; flex:none; }
  .toast.warn { border-top:8px solid var(--stop); } .toast.warn .logo { background:var(--stop); }
  .sheet { position:absolute; inset:auto 0 0 0; background:var(--card); border-radius:28px 28px 0 0; padding:18px 18px 28px; box-shadow:0 -16px 36px rgba(15,58,46,.18); transform:translateY(105%); transition:transform .4s ease; z-index:35; }
  .sheet.show { transform:none; }
  .sheet h3 { margin:0 0 8px; font-size:22px; }
  .tog { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:16px; font-weight:600; }
  .sw { width:48px; height:28px; border-radius:999px; background:#cfd8d2; position:relative; cursor:pointer; transition:background .2s; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .2s; }
  .sw.on { background:var(--ink); } .sw.on::after { left:23px; }
  input.txt, select.txt, textarea.txt { width:100%; border:0; border-radius:16px; padding:12px; font:500 16px var(--font); background:var(--card); color:var(--ink); }
  textarea.txt { resize:none; height:72px; }
  .stamp { position:absolute; inset:0; display:grid; place-items:center; background:rgba(233,240,234,.88); z-index:45; opacity:0; pointer-events:none; transition:opacity .3s; }
  .stamp.show { opacity:1; }
  .stamp div { border-top:10px solid var(--ink); color:var(--ink); font:800 28px var(--font); padding:16px 24px; border-radius:24px; transform:scale(1.5); transition:transform .35s cubic-bezier(.2,1.6,.4,1); background:var(--card); text-align:center; }
  .stamp.show div { transform:scale(1); } .stamp small { display:block; font-size:15px; color:var(--mute); font-weight:600; }
  .blocked { background:var(--card); border-top:10px solid var(--stop); border-radius:22px; padding:12px 14px; font-size:15px; line-height:1.35; margin-top:12px; }
  .blocked b { color:var(--stop); font-size:18px; display:block; }
  .sect { font-size:17px; font-weight:800; color:var(--ink); margin:14px 2px 8px; }
  .cred { display:flex; gap:10px; align-items:center; }
  .cred .ic { width:42px; height:42px; border-radius:50%; background:var(--tint4); display:grid; place-items:center; color:var(--ink); flex:none; font-weight:800; }
  .cred.weak { opacity:.6; } .cred.weak .ic { background:var(--tint3); color:var(--stop); }
  .flag { color:var(--stop); font-size:13px; font-weight:700; }
  .qr { background:#fff; padding:8px; border-radius:16px; display:inline-block; }
  .empty { text-align:center; color:var(--mute); font-size:15px; padding:20px 10px; background:var(--card); border-radius:22px; }
  .demo-note { font-size:12px; color:var(--mute); text-align:center; margin-top:8px; }
  .doors { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .door { border-radius:22px; padding:14px; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; font-weight:700; font-size:19px; line-height:1.1; }
  .door small { display:block; font-weight:500; font-size:13px; opacity:.85; margin-top:3px; }
  .door.c { background:var(--ink); color:#fff; } .door.r { background:var(--gold); color:var(--ink); }
  @media (max-width: 860px) { body { overflow:auto; } .stage { flex-direction:column; height:auto; gap:30px; } }
  @media (max-height: 860px) and (min-width: 861px) { .phone { transform:scale(calc((100vh - 90px) / 800)); transform-origin:center; } .stage { gap:24px; } }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="caption"><span>Worker app · <b id="wCap">Worker's phone</b></span></div>
    <div class="phone"><div class="screen" id="W">
      <div class="status"><span>9:41</span><span class="ic">5G <span class="bat"></span></span></div>
      <div class="appbar"><div class="logo">K</div><div><h1>KelasaPass</h1><small id="wWho">ಕೆಲಸ · Work</small></div>
        <div class="right lang" id="wLang"><button data-l="kn" class="on">ಕನ್ನಡ</button><button data-l="hi">हिंदी</button><button data-l="en">EN</button></div></div>
      <div class="body" id="wBody"></div>
      <div class="nav" id="wNav">
        <button data-t="jobs" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Jobs</button>
        <button data-t="proof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>My proof</button>
        <button data-t="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
      </div>
      <div class="toast" id="wToast"></div>
      <div class="stamp" id="wStamp"><div>✓ Verified job<small id="wStampSub"></small></div></div>
    </div></div>
  </div>
  <div>
    <div class="caption"><span>Contractor app · <b id="cCap">Sri Lakshmi Hardware</b></span></div>
    <div class="phone"><div class="screen" id="C">
      <div class="status"><span>9:41</span><span class="ic">5G <span class="bat"></span></span></div>
      <div class="appbar"><div class="logo" style="background:var(--gold);color:var(--ink)">K</div><div><h1>KelasaPass <span style="color:var(--gold)">Hire</span></h1><small id="cWho">Contractor</small></div>
        <div class="right"><span class="lvl L1" id="cLvl">L1 verified</span></div></div>
      <div class="body" id="cBody"></div>
      <div class="nav" id="cNav">
        <button data-t="post" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Post job</button>
        <button data-t="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c1-3.5 3.5-5 6-5s5 1.5 6 5M15 15c2.5 0 4.5 1.3 5.5 4"/></svg>Matches</button>
        <button data-t="hires"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>Hired</button>
      </div>
      <div class="sheet" id="cSheet"></div>
      <div class="toast" id="cToast"></div>
    </div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText); return r.json();
};
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const AV = ["#fde7c8", "#dbeafe", "#fbe1e1", "#e3f4e1"];
const avColor = (name) => AV[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
const TRADE = { electrician:{kn:"ಎಲೆಕ್ಟ್ರಿಷಿಯನ್", hi:"इलेक्ट्रीशियन", en:"Electrician"}, plumber:{kn:"ಪ್ಲಂಬರ್", hi:"प्लंबर", en:"Plumber"},
  mason:{kn:"ಗಾರೆ ಕೆಲಸಗಾರ", hi:"राजमिस्त्री", en:"Mason"}, painter:{kn:"ಪೇಂಟರ್", hi:"पेंटर", en:"Painter"}, carpenter:{kn:"ಬಡಗಿ", hi:"बढ़ई", en:"Carpenter"} };
const tr = (t, l = "en") => (TRADE[t] && TRADE[t][l]) || t;
const T = {
  kn: { speak:"ಮಾತನಾಡಿ", tap:"ನಿಮ್ಮ ಕೆಲಸದ ಬಗ್ಗೆ ಹೇಳಿ", listening:"ಕೇಳುತ್ತಿದೆ…", yes:"ಹೌದು, ಸರಿ", edit:"ಬದಲಿಸಿ", newjob:"ಹೊಸ ಕೆಲಸ", accept:"ಒಪ್ಪಿಕೊಳ್ಳಿ", ready:"ಪ್ರೊಫೈಲ್ ಸಿದ್ಧವಾಗಿದೆ", proof:"ನನ್ನ ಪುರಾವೆ" },
  hi: { speak:"बोलिए", tap:"अपने काम के बारे में बताइए", listening:"सुन रहा है…", yes:"हाँ, सही है", edit:"बदलें", newjob:"नया काम", accept:"स्वीकार करें", ready:"प्रोफ़ाइल तैयार है", proof:"मेरा सबूत" },
  en: { speak:"Speak", tap:"Tell us about your work", listening:"Listening…", yes:"Yes, correct", edit:"Edit", newjob:"New job", accept:"Accept", ready:"Profile ready", proof:"My proof" },
};
const SAMPLES = {
  kn: "ನಾನು ಎಲೆಕ್ಟ್ರಿಷಿಯನ್, 8 ವರ್ಷ ಅನುಭವ, ಎಸ್ ಎಸ್ ಪುರಂ, ದಿನಕ್ಕೆ 800 ರೂಪಾಯಿ",
  hi: "मैं प्लंबर हूँ, 4 साल, शेट्टिहल्ली shettihalli, 750 रुपये",
  en: "Painter, 3 years, Batawadi, Rs 650",
};
const JOB_SAMPLES = [
  ["2 electricians", "Need 2 electricians at SS Puram tomorrow, Rs 900"],
  ["ಗಾರೆ (masons)", "ನಾಳೆ ಕ್ಯಾತಸಂದ್ರದಲ್ಲಿ 2 ಗಾರೆ ಕೆಲಸಗಾರರು ಬೇಕು kyathasandra, ದಿನಕ್ಕೆ 1000 ರೂಪಾಯಿ"],
  ["Scam test", "Job guaranteed! Pay Rs 500 registration fee first"],
];
let voiceOn = false;
const S = { lang:"kn", wTab:"jobs", worker:null, draft:null, offers:[], cTab:"post", employer:null, employers:[], job:null, matches:[], hires:[] };

function toast(which, html, warn) {
  const el = $(which === "W" ? "#wToast" : "#cToast");
  el.className = "toast" + (warn ? " warn" : ""); el.innerHTML = `<div class="logo">K</div><div>${html}</div>`;
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), warn ? 5200 : 3600);
}
function ring(p) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#f0a03a" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Anek Kannada, sans-serif">${Math.round(p * 100)}</text></svg>`;
}

// ================= WORKER APP =================
function wRender() {
  const L = T[S.lang], b = $("#wBody");
  $("#wCap").textContent = (S.worker ? S.worker.name.split(" ")[0] : ($("#wName") ? $("#wName").value.split(" ")[0] : "Ramesh")) + "'s phone";
  $("#wWho").textContent = S.worker ? `${S.worker.name} · ${tr(S.worker.trade, S.lang)}` : "ಕೆಲಸ · Work";
  document.querySelectorAll("#wNav button").forEach(x => x.classList.toggle("on", x.dataset.t === S.wTab));
  if (!S.worker || !S.worker.confirmed) { b.innerHTML = wOnboard(L); wBindOnboard(); return; }
  if (S.wTab === "jobs") b.innerHTML = wJobs(L);
  if (S.wTab === "proof") { b.innerHTML = `<div class="sect">${L.proof}</div><div id="wCreds"><div class="empty">Loading…</div></div>`; wLoadProof(); }
  if (S.wTab === "profile") { b.innerHTML = wProfile(); const q = $("#wQR"); if (q && window.QRCode) new QRCode(q, {text:location.origin + "/p/" + S.worker.id, width:120, height:120}); }
  wBindJobs();
}
function wOnboard(L) {
  if (S.draft) {
    const w = S.draft;
    return `<div class="bubble me"><span class="tag">🎤 ${voiceOn ? "Voice note" : "Voice note (demo transcript)"}</span>${esc(w.transcript)}</div>
      <div class="bubble"><span class="tag">KelasaPass</span>${esc(S.draftReply)}
        <div class="fields"><div class="field"><small>Work</small><b>${esc(tr(w.trade, S.lang))}</b></div><div class="field"><small>Experience</small><b>${w.years ?? "?"} yrs</b></div>
        <div class="field"><small>Area</small><b>${esc(w.locality)}</b></div><div class="field"><small>Daily rate</small><b>₹${w.daily_rate ?? "?"}</b></div></div></div>
      <div class="row"><button class="btn ghost" id="wEdit">${L.edit}</button><button class="btn orange" id="wYes">✓ ${L.yes}</button></div>`;
  }
  return `<div class="hero"><h2>ನಮಸ್ಕಾರ 👋</h2><p>${L.tap}. No typing needed.</p></div>
    <div class="center"><button class="mic" id="wMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div style="font-weight:800;font-size:18px" id="wMicLbl">${L.speak}</div><div class="hint" id="wMicHint">Tap and talk, like a WhatsApp voice note</div></div>
    <div class="sect">Try a voice note</div>
    <div class="chips">${Object.entries(SAMPLES).map(([l, s]) => `<button class="chip ${l === S.lang ? "sel" : ""}" data-s="${l}">${l === "kn" ? "ಕನ್ನಡ electrician" : l === "hi" ? "हिंदी plumber" : "English painter"}</button>`).join("")}</div>
    <div class="sect">Your name</div><input class="txt" id="wName" value="Ramesh K">
    ${voiceOn ? "" : `<div class="demo-note">Demo mode: voice keys not set, the mic plays the selected sample note</div>`}`;
}
function wBindOnboard() {
  document.querySelectorAll("[data-s]").forEach(c => c.onclick = () => { S.lang = c.dataset.s; setLang(); });
  const mic = $("#wMic");
  if (mic) mic.onclick = async () => {
    const L = T[S.lang]; mic.classList.add("rec"); $("#wMicLbl").textContent = L.listening;
    $("#wMicHint").innerHTML = `<div class="wave" style="justify-content:center">${"<i></i>".repeat(14).replace(/<i><\/i>/g, (m, i) => `<i style="animation-delay:${(Math.random() * .8).toFixed(2)}s"></i>`)}</div>`;
    await sleep(2200);
    const name = $("#wName").value || "Ramesh K";
    const res = await api("/api/workers", {name, phone:"+91-9" + Date.now() % 1e9, text:SAMPLES[S.lang], device_id:"dev-" + name});
    if (!res.ok) { toast("W", esc(res.reply), true); wRender(); return; }
    S.draft = res.worker; S.draftReply = res.reply; wRender();
  };
  const yes = $("#wYes");
  if (yes) yes.onclick = async () => {
    S.worker = await api(`/api/workers/${S.draft.id}/confirm`, {}); S.draft = null; S.wTab = "profile";
    toast("W", `<b>${T[S.lang].ready} ✓</b><br>Share your proof link anywhere`); wRender(); cRefreshEmployers();
  };
  const ed = $("#wEdit"); if (ed) ed.onclick = () => { S.draft = null; wRender(); };
}
function wJobs(L) {
  const offers = S.offers.filter(o => o.worker_id === S.worker.id);
  return `<div class="hero"><h2>${esc(S.worker.name)}</h2><p>${esc(tr(S.worker.trade, S.lang))} · ${esc(S.worker.locality)} · ₹${S.worker.daily_rate ?? "?"}/day</p></div>
    <div class="sect">${L.newjob}s near you</div>` + (offers.length ? offers.map(o => `
    <div class="card job"><div class="row" style="justify-content:space-between"><h3>${esc(tr(o.job.trade))} · ${o.job.workers_needed} needed</h3><span class="lvl L1" style="flex:none">${esc(o.employer.level)}</span></div>
      <div class="meta">${esc(o.employer.name)} · ${esc(o.job.locality)} · ${esc(o.job.when)}</div>
      <span class="pill">📍 ${o.distance} km</span><span class="pill good">₹${o.job.wage ?? "?"}/day</span><span class="pill">No fee ever</span>
      <div style="margin-top:10px">${o.status === "offered" ? `<button class="btn orange" data-acc="${o.job.id}">✓ ${L.accept}</button>` :
        `<div class="pill good" style="width:100%;text-align:center;padding:10px">${o.status === "done" ? "Completed · verified ✓" : "Accepted · see you there"}</div>`}</div></div>`).join("")
    : `<div class="empty">No job alerts yet. Alerts arrive here and on WhatsApp.</div>`);
}
function wBindJobs() {
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = async () => {
    const o = S.offers.find(x => x.job.id === b.dataset.acc && x.worker_id === S.worker.id);
    await api(`/api/jobs/${o.job.id}/accept`, {worker_id:S.worker.id}); o.status = "accepted";
    S.hires.push(o); toast("C", `<b>${esc(S.worker.name)} accepted</b><br>${esc(tr(o.job.trade))} · ${esc(o.job.locality)}`);
    wRender(); S.cTab = "hires"; cRender();
  });
}
async function wLoadProof() {
  const p = await api(`/api/workers/${S.worker.id}/profile`);
  $("#wCreds").innerHTML = `<div class="hero"><div class="stat">${ring(p.proof_score)}<div><h2 style="margin:0">${p.verified_jobs} verified jobs</h2><p>Proof score · signed, shareable</p></div></div></div>` +
    (p.credentials.length ? p.credentials.map(c => `<div class="card cred ${c.weight < 0.2 ? "weak" : ""}"><div class="ic">${c.weight < 0.2 ? "!" : "✓"}</div>
      <div style="flex:1"><b>${esc(tr(c.trade))}</b> · ${esc(c.employer_name)}<br><span class="lvl L${c.evidence_level}">L${c.evidence_level}</span>
      <span class="hint">weight ${c.weight}</span>${c.flags.length ? `<div class="flag">⚠ ${c.flags.join(", ")}</div>` : ""}</div></div>`).join("")
     : `<div class="empty">Every finished job becomes proof. Your first one appears here.</div>`);
}
function wProfile() {
  const w = S.worker;
  return `<div class="hero center"><div class="av" style="background:${avColor(w.name)};width:64px;height:64px;font-size:26px;margin:0 auto 8px;border-radius:20px">${esc(w.name[0])}</div>
    <h2>${esc(w.name)}</h2><p>${esc(tr(w.trade, S.lang))} · ${w.years ?? "?"} yrs · ${esc(w.locality)}</p></div>
    <div class="card center"><div class="qr" id="wQR"></div><div style="font-weight:700;margin-top:8px">Scan to verify my work</div>
    <a class="hint" href="/p/${w.id}" target="_blank">kelasapass/p/${w.id}</a></div>`;
}
document.querySelectorAll("#wNav button").forEach(b => b.onclick = () => { if (S.worker && S.worker.confirmed) { S.wTab = b.dataset.t; wRender(); } });
function setLang() { document.querySelectorAll("#wLang button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lang)); wRender(); }
document.querySelectorAll("#wLang button").forEach(b => b.onclick = () => { S.lang = b.dataset.l; setLang(); });

// ================= CONTRACTOR APP =================
async function cRefreshEmployers() { S.employers = await api("/api/employers"); if (!S.employer) S.employer = S.employers.find(e => e.level === "L1") || S.employers[0]; cHeader(); }
function cHeader() { if (!S.employer) return; $("#cWho").textContent = S.employer.name; $("#cCap").textContent = S.employer.name;
  $("#cLvl").textContent = S.employer.level + (S.employer.level === "L1" ? " verified" : " phone"); $("#cLvl").className = "lvl " + S.employer.level; }
function cRender() {
  document.querySelectorAll("#cNav button").forEach(x => x.classList.toggle("on", x.dataset.t === S.cTab));
  const b = $("#cBody");
  if (S.cTab === "post") {
    b.innerHTML = `<div class="hero gold"><h2>Need workers?</h2><p>Say it like you would on WhatsApp. We find verified people nearby.</p></div>
      <div class="sect">Describe the job</div><textarea class="txt" id="cText" placeholder="e.g. 2 electricians at SS Puram tomorrow, ₹900"></textarea>
      <div class="chips" style="margin:8px 0 12px">${JOB_SAMPLES.map(([l, s], i) => `<button class="chip" data-j="${i}">${esc(l)}</button>`).join("")}</div>
      <button class="btn orange" id="cPost">🎤 Post job</button>
      ${S.blocked ? `<div class="blocked" style="margin-top:12px"><b>Blocked by scam guard.</b> Asking workers for money is never allowed. Workers are warned in Kannada and Hindi.</div>` : ""}
      ${S.employers.length ? `<div class="sect">Posting as</div><select class="txt" id="cEmp">${S.employers.map(e => `<option value="${e.id}" ${S.employer && e.id === S.employer.id ? "selected" : ""}>${esc(e.name)} (${e.level})</option>`).join("")}</select>` : ""}`;
    document.querySelectorAll("[data-j]").forEach(c => c.onclick = () => { $("#cText").value = JOB_SAMPLES[c.dataset.j][1]; });
    const sel = $("#cEmp"); if (sel) sel.onchange = () => { S.employer = S.employers.find(e => e.id === sel.value); cHeader(); };
    $("#cPost").onclick = cPost;
  }
  if (S.cTab === "matches") {
    if (!S.job) { b.innerHTML = `<div class="empty">Post a job to see matched workers.</div>`; return; }
    const j = S.job;
    b.innerHTML = `<div class="card"><b>${j.workers_needed} × ${esc(tr(j.trade))}</b> · ${esc(j.locality)} · ${esc(j.when)} · ₹${j.wage ?? "?"}/day
      <div class="hint" style="margin-top:4px">Ranked by skill, distance, verified history and rate</div></div>` +
      (S.matches.length ? S.matches.slice(0, 5).map((m, i) => { const w = m.worker; const sent = S.offers.find(o => o.job.id === j.id && o.worker_id === w.id);
        return `<div class="card"><div class="worker"><div class="av" style="background:${avColor(w.name)}">${esc(w.name[0])}</div><div style="flex:1">
          <div class="row" style="justify-content:space-between"><b style="font-size:16px">${esc(w.name)}</b><span class="rank" style="flex:none">#${i + 1} · ${Math.round(m.score * 100)}</span></div>
          <div class="hint">${esc(tr(w.trade))} · ${w.years ?? "?"} yrs</div><div class="score"><i style="width:${Math.round(m.score * 100)}%"></i></div>
          ${m.reasons.map(r => `<span class="pill ${/verified job/.test(r) && !/no verified/.test(r) ? "good" : ""}">${esc(r)}</span>`).join("")}
          <div class="row" style="margin-top:8px"><a class="btn ghost" style="text-align:center;text-decoration:none;padding:10px" href="/p/${w.id}" target="_blank">Proof</a>
          <button class="btn ${sent ? "mint" : ""}" style="padding:10px" data-hire="${w.id}" ${sent ? "disabled" : ""}>${sent ? "Offer sent ✓" : "Send offer"}</button></div></div></div></div>`; }).join("")
      : `<div class="empty">No workers for this trade nearby yet.</div>`);
    document.querySelectorAll("[data-hire]").forEach(btn => btn.onclick = () => cOffer(btn.dataset.hire));
  }
  if (S.cTab === "hires") {
    b.innerHTML = `<div class="sect">Hired workers</div>` + (S.hires.length ? S.hires.map((o, i) => `<div class="card"><div class="worker"><div class="av" style="background:${avColor(o.worker.name)}">${esc(o.worker.name[0])}</div>
      <div style="flex:1"><b>${esc(o.worker.name)}</b><div class="hint">${esc(tr(o.job.trade))} · ${esc(o.job.locality)} · ₹${o.job.wage ?? "?"}/day</div>
      <div style="margin-top:8px">${o.status === "done" ? `<span class="lvl L${o.cred.evidence_level}">L${o.cred.evidence_level} credential issued</span>` :
        `<button class="btn" style="padding:10px" data-done="${i}">Mark job done</button>`}</div></div></div></div>`).join("")
      : `<div class="empty">When a worker accepts your offer, they appear here.</div>`);
    document.querySelectorAll("[data-done]").forEach(btn => btn.onclick = () => cSheet(S.hires[btn.dataset.done]));
  }
}
async function cPost() {
  const text = $("#cText").value.trim(); if (!text) return;
  const res = await api("/api/jobs", {employer_id:S.employer.id, text});
  if (res.blocked) { S.blocked = true; cRender();
    if (S.worker) toast("W", `<b>${esc(res.warnings.kn)}</b><br><span class="hint">${esc(res.warnings.hi)}</span>`, true);
    toast("C", "<b>Message blocked</b><br>Fee requests are not allowed", true); return; }
  S.blocked = false;
  if (!res.ok) { toast("C", esc(res.reply), true); return; }
  S.job = res.job; S.matches = await api(`/api/jobs/${S.job.id}/matches`); S.cTab = "matches"; cRender();
}
async function cOffer(workerId) {
  const m = S.matches.find(x => x.worker.id === workerId);
  const offer = {job:S.job, worker_id:workerId, worker:m.worker, employer:S.employer, distance:m.distance_km, status:"offered"};
  S.offers.push(offer);
  // the worker phone follows the person receiving the offer
  if (!S.worker || S.worker.id !== workerId) { S.worker = Object.assign({}, m.worker); }
  S.wTab = "jobs"; wRender(); cRender();
  toast("W", `<b>${T[S.lang].newjob}: ${esc(tr(S.job.trade, S.lang))}</b><br>${esc(S.employer.name)} · ${m.distance_km} km · ₹${S.job.wage ?? "?"}`);
}
function cSheet(o) {
  const sh = $("#cSheet");
  sh.innerHTML = `<h3>Did ${esc(o.worker.name)} finish the job?</h3>
    <div class="tog">Finished <div class="sw on" data-k="finished"></div></div>
    <div class="tog">On time <div class="sw on" data-k="on_time"></div></div>
    <div class="tog">Would hire again <div class="sw on" data-k="rehire"></div></div>
    <div class="tog">Geotagged photo at site <div class="sw on" data-k="photo"></div></div>
    <div style="margin:12px 0 14px"><small class="hint">UPI payment reference (optional, raises proof level)</small><input class="txt" id="cUpi" value="412398765099"></div>
    <div class="row"><button class="btn ghost" id="cCancel">Cancel</button><button class="btn mint" id="cConfirm">✓ Confirm</button></div>`;
  sh.querySelectorAll(".sw").forEach(s => s.onclick = () => s.classList.toggle("on"));
  sh.classList.add("show");
  $("#cCancel").onclick = () => sh.classList.remove("show");
  $("#cConfirm").onclick = async () => {
    const on = (k) => sh.querySelector(`[data-k="${k}"]`).classList.contains("on");
    const body = {worker_id:o.worker_id, finished:on("finished"), on_time:on("on_time"), rehire:on("rehire"), upi_ref:$("#cUpi").value || null};
    if (on("photo")) { body.photo_lat = o.job.lat; body.photo_lon = o.job.lon; }
    const r = await api(`/api/jobs/${o.job.id}/complete`, body);
    sh.classList.remove("show");
    if (!r.ok) { toast("C", esc(r.reply)); return; }
    o.status = "done"; o.cred = r.credential; cRender();
    const off = S.offers.find(x => x.job.id === o.job.id && x.worker_id === o.worker_id); if (off) off.status = "done";
    toast("C", `<b>Credential issued</b><br>L${r.credential.evidence_level} · signed · weight ${r.credential.weight}`);
    $("#wStampSub").textContent = `L${r.credential.evidence_level} · ${S.employer.name}`;
    $("#wStamp").classList.add("show"); await sleep(1900); $("#wStamp").classList.remove("show");
    S.wTab = "proof"; wRender();
  };
}
document.querySelectorAll("#cNav button").forEach(b => b.onclick = () => { S.cTab = b.dataset.t; cRender(); });

(async () => {
  try { voiceOn = (await api("/api/status")).voice_stt; } catch (e) {}
  if (!(await api("/api/employers")).length) await api("/api/seed", {});
  await cRefreshEmployers(); wRender(); cRender();
})();
</script>
</body>
</html>
